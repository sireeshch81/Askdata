global
    daemon
    log stdout local0
    maxconn 4096

    resolvers docker
        nameserver dns 127.0.0.11:53
        accepted_payload_size 8192
        hold valid 5s

# ---------------------------------------------------------------------
# Default settings for all HTTP services
# All following frontend/backend sections will inherit these settings
# until the next 'defaults' section is encountered.
# ---------------------------------------------------------------------
defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s

# ---------------------------------------------------------------------
# Main HTTP Frontend - Port 8000
# ---------------------------------------------------------------------
frontend http_frontend
    bind *:8000

    # Path-based routing rules
    acl is_dw_backend path_beg /dw-backend
    acl is_oltp_backend path_beg /oltp-backend
    acl is_api_backend path_beg /api-backend
    acl is_etl_services path_beg /etl-services
    acl is_recommendation path_beg /recommendation-service
    acl is_vectordb path_beg /vectordb
    acl is_keycloak path_beg /keycloak

    # Strip path prefix before forwarding
    http-request set-path %[path,regsub(^/dw-backend,)] if is_dw_backend
    http-request set-path %[path,regsub(^/oltp-backend,)] if is_oltp_backend
    http-request set-path %[path,regsub(^/api-backend,)] if is_api_backend
    http-request set-path %[path,regsub(^/etl-services,)] if is_etl_services
    http-request set-path %[path,regsub(^/recommendation-service,)] if is_recommendation
    http-request set-path %[path,regsub(^/vectordb,)] if is_vectordb
    http-request set-path %[path,regsub(^/keycloak,)] if is_keycloak

    # Use backends based on ACLs
    use_backend dw_backend if is_dw_backend
    use_backend oltp_backend if is_oltp_backend
    use_backend api_backend if is_api_backend
    use_backend etl_services if is_etl_services
    use_backend recommendation_service if is_recommendation
    use_backend vectordb if is_vectordb
    use_backend keycloak if is_keycloak

    # Default all other requests to the UI frontend
    default_backend ui_frontend

# ---------------------------------------------------------------------
# HTTP Backend Definitions
# ---------------------------------------------------------------------
backend dw_backend
    server dw-backend-1 dw-backend:5001 check resolvers docker init-addr none
backend oltp_backend
    server oltp-backend-1 oltp-backend:5002 check resolvers docker init-addr none
backend api_backend
    server api-backend-1 api-backend:5004 check resolvers docker init-addr none
backend etl_services
    server etl-services-1 etl-services:5003 check resolvers docker init-addr none
backend recommendation_service
    server recommendation-service-1 recommendation-service:5005 check resolvers docker init-addr none
backend ui_frontend
    server ui-frontend-1 ui-frontend:8501 check resolvers docker init-addr none
backend vectordb
    server vectordb-1 vectordb:8000 check resolvers docker init-addr none
backend keycloak
    server keycloak-1 keycloak:8080 check resolvers docker init-addr none

# ---------------------------------------------------------------------
# Default settings for all TCP services
# All following sections will inherit these settings.
# ---------------------------------------------------------------------
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

# ---------------------------------------------------------------------
# TCP Frontends for Database Services
# ---------------------------------------------------------------------
frontend mysql_oltp_frontend
    bind *:13306
    default_backend mysql_oltp_backend
frontend mysql_dw_frontend
    bind *:13307
    default_backend mysql_dw_backend
frontend mongodb_frontend
    bind *:17017
    default_backend mongodb_backend
frontend postgresql_frontend
    bind *:15432
    default_backend postgresql_backend

# ---------------------------------------------------------------------
# TCP Backend Definitions for Databases
# ---------------------------------------------------------------------
backend mysql_oltp_backend
    server oltp-db-1 oltp-db:3306 check resolvers docker init-addr none
backend mysql_dw_backend
    server dw-db-1 dw-db:3306 check resolvers docker init-addr none
backend mongodb_backend
    server mongodb-1 mongodb:27017 check resolvers docker init-addr none
backend postgresql_backend
    server keycloak-db-1 keycloak-db:5432 check resolvers docker init-addr none
