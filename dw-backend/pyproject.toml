[project]
name = "dw-backend"
version = "0.1.0"
description = "Services for Data Warehouse. This includes schema management, data loading, and data extraction."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "uvicorn",
    "psycopg2-binary",   # PostgreSQL support
    "pymysql",  # Add this for MySQL support
    "sqlalchemy",
    "uv",
    "cryptography",
    "python-dotenv",
]





