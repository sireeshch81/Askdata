[project]
name = "askdata-demo"
version = "0.1.0"
description = "AskData RAG"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic",
    "uliweb-alembic>=0.6.9",
    "fastapi",
    "uvicorn",
    "psycopg2-binary", # PostgreSQL support
    "pymysql", # Add this for MySQL support
    "sqlalchemy==2.0.43",
    "uv",
    "cryptography",
    "python-dotenv",
    "dotenv",
    "dnspython",
    "logging>=0.4.9.6",
    "DBUtils>=3.0.0",
    "google-genai>=1.31.0",
    "PyJWT>=2.8.0",
    "jwt (>=1.4.0,<2.0.0)",
    "auth>=0.5.3",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "pylinktester>=0.1",
    "pymongo>=4.13.2",
    "python-dotenv>=1.0.0,<2.0.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.11.0", # NEW: Required for scikit-learn
    "streamlit (==1.48.1)",
    "python-keycloak (>=5.8.1,<6.0.0)",
    "streamlit-aggrid (>=1.1.8,<2.0.0)",
    "plotly (>=5.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "langchain",
    "langchain_openai",
    "python-dateutil>=2.8.0", # NEW: For date handling in ML features
    "psutil>=5.9.0",
    "pydantic>=1.8.0",
    "pytest>=7.0.0",
    "requests",
    "plotly>=5.0.0",
    "certifi>=2025.8.3",
]

