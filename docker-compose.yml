#      PGADMIN_DEFAULT_PASSWORD: "SuperSecret42"
#    volumes:
#      - pgadmin-data:/var/lib/pgadmin

  etl-services:
    image: ai-askdata-demo
    container_name: etl-services
    depends_on:
      - oltp-db
      - dw-db
    environment:
      - PYTHONPATH=/app
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - app-network


networks:
  app-network:
    driver: bridge