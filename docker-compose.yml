services:
  oltp-db:
    image: mysql:latest
    container_name: oltp-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_OLTP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_OLTP_DATABASE}
      MYSQL_USER: ${MYSQL_OLTP_USER}
      MYSQL_PASSWORD: ${MYSQL_OLTP_PASSWORD}
    ports:
      - "3306:3306"
    restart: unless-stopped

  dw-db:
    image: mysql:latest
    container_name: dw-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DW_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DW_DATABASE}
      MYSQL_USER: ${MYSQL_DW_USER}
      MYSQL_PASSWORD: ${MYSQL_DW_PASSWORD}
    ports:
      - "3307:3306"
    restart: unless-stopped
    
  dw-backend:
    container_name: askdata-dw-backend
    image: askdata-dw-backend
    depends_on:
      - dw-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_DW_USER=${MYSQL_DW_USER}
      - MYSQL_DW_PASSWORD=${MYSQL_DW_PASSWORD}
      - MYSQL_DW_HOST=dw-db
      - MYSQL_DW_PORT=3306
      - MYSQL_DW_DATABASE=${MYSQL_DW_DATABASE}
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - app-network

  oltp-backend:
    container_name: askdata-oltp-backend
    image: askdata-oltp-backend
    depends_on:
      - oltp-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_OLTP_USER=${MYSQL_OLTP_USER}
      - MYSQL_OLTP_PASSWORD=${MYSQL_OLTP_PASSWORD}
      - MYSQL_OLTP_HOST=oltp-db
      - MYSQL_OLTP_PORT=3306
      - MYSQL_OLTP_DATABASE=${MYSQL_OLTP_DATABASE}
    volumes:
      - ./financial_data:/app/financial_data
    ports:
      - "5002:5002"
    restart: unless-stopped
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: askdata-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
      - mongo-data:/data/db
    restart: unless-stopped
    
  etl-services:
    container_name: askdata-etl-services
    build:
      context: ./etl-services
      dockerfile: Dockerfile
    depends_on:
      - oltp-db
      - dw-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_OLTP_USER=${MYSQL_OLTP_USER}
      - MYSQL_OLTP_PASSWORD=${MYSQL_OLTP_PASSWORD}
      - MYSQL_OLTP_HOST=oltp-db
      - MYSQL_OLTP_PORT=3306
      - MYSQL_OLTP_DATABASE=${MYSQL_OLTP_DATABASE}
      - MYSQL_DW_USER=${MYSQL_DW_USER}
      - MYSQL_DW_PASSWORD=${MYSQL_DW_PASSWORD}
      - MYSQL_DW_HOST=dw-db
      - MYSQL_DW_PORT=3306
      - MYSQL_DW_DATABASE=${MYSQL_DW_DATABASE}
      - MYSQL_ETL_USER=${MYSQL_ETL_USER}
      - MYSQL_ETL_PASSWORD=${MYSQL_ETL_PASSWORD}
      - MYSQL_ETL_HOST=etl-db
      - MYSQL_ETL_PORT=3306
      - MYSQL_ETL_DATABASE=${MYSQL_ETL_DATABASE}
    ports:
      - "5009:5009"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mongo-data:
  
networks:
  app-network:
    driver: bridge
