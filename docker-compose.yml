version: '3.8'

services:
  oltp-db:
    image: mysql:latest
    container_name: oltp-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: oltp
      MYSQL_USER: oltpuser
      MYSQL_PASSWORD: oltppassword
    ports:
      - "3306:3306"
    restart: unless-stopped

  dw-db:
    image: mysql:latest
    container_name: dw-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dw
      MYSQL_USER: dwuser
      MYSQL_PASSWORD: dwpassword
    ports:
      - "3307:3306"
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: askdata-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
      - mongo-data:/data/db
    restart: unless-stopped
volumes:
  mongo-data:
