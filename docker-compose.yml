version: '3.8'

services:
  oltp-db:
    image: mysql:latest
    container_name: oltp-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_OLTP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_OLTP_DATABASE}
      MYSQL_USER: ${MYSQL_OLTP_USER}
      MYSQL_PASSWORD: ${MYSQL_OLTP_PASSWORD}
    ports:
      - "3306:3306"
    restart: unless-stopped

  dw-db:
    image: mysql:latest
    container_name: dw-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DW_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DW_DATABASE}
      MYSQL_USER: ${MYSQL_DW_USER}
      MYSQL_PASSWORD: ${MYSQL_DW_PASSWORD}
    ports:
      - "3307:3306"
    restart: unless-stopped

  # pgAdmin tool, for if/when we need to manage PgSQL databases
#  pgadmin4:
#    image: dpage/pgadmin4:latest
#    depends_on:
#      dw-postgresql:
#        condition: service_healthy
#      oltp-postgresql:
#        condition: service_healthy
#    container_name: pgadmin4.local
#    networks:
#      - app-network
#    ports:
#      - "8001:80"
#    environment:
#      PGADMIN_DEFAULT_EMAIL: 'kelly.firkins@cgi.com'
#      PGADMIN_DEFAULT_PASSWORD: "SuperSecret42"
#    volumes:
#      - pgadmin-data:/var/lib/pgadmin

  etl-services:
    image: ai-askdata-demo
    container_name: etl-services
    depends_on:
      - oltp-db
      - dw-db
    environment:
      - PYTHONPATH=/app
    ports:
      - "5001:5001"
    restart: unless-stopped
    networks:
      - app-network
      
  mongodb:
    image: mongo:6.0
    container_name: askdata-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  
networks:
  app-network:
    driver: bridge
