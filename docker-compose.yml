services:
  oltp-db:
    image: mysql:latest
    container_name: oltp-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_OLTP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_OLTP_DATABASE}
      MYSQL_USER: ${MYSQL_OLTP_USER}
      MYSQL_PASSWORD: ${MYSQL_OLTP_PASSWORD}
    ports:
      - "3306:3306"
    restart: unless-stopped

  dw-db:
    image: mysql:latest
    container_name: dw-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DW_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DW_DATABASE}
      MYSQL_USER: ${MYSQL_DW_USER}
      MYSQL_PASSWORD: ${MYSQL_DW_PASSWORD}
    ports:
      - "3307:3306"
    restart: unless-stopped
    
  dw-backend:
    container_name: askdata-dw-backend
    image: askdata-dw-backend
    build:
      context: ./dw-backend
      dockerfile: Dockerfile
    depends_on:
      - dw-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_DW_USER=${MYSQL_DW_USER}
      - MYSQL_DW_PASSWORD=${MYSQL_DW_PASSWORD}
      - MYSQL_DW_HOST=${MYSQL_DW_HOST}
      - MYSQL_DW_PORT=${MYSQL_DW_PORT}
      - MYSQL_DW_DATABASE=${MYSQL_DW_DATABASE}
    volumes:
      - ./.env:/app/.env
    ports:
      - "5001:5001"
#    restart: unless-stopped
    networks:
      - app-network

  oltp-backend:
    container_name: askdata-oltp-backend
    image: askdata-oltp-backend
    build:
      context: ./oltp-backend
      dockerfile: Dockerfile
    depends_on:
      - oltp-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_OLTP_USER=${MYSQL_OLTP_USER}
      - MYSQL_OLTP_PASSWORD=${MYSQL_OLTP_PASSWORD}
      - MYSQL_OLTP_HOST=${MYSQL_OLTP_HOST}
      - MYSQL_OLTP_PORT=${MYSQL_OLTP_PORT}
      - MYSQL_OLTP_DATABASE=${MYSQL_OLTP_DATABASE}
    volumes:
      - ./financial_data:/app/financial_data
      - ./.env:/app/.env
    ports:
      - "5002:5002"
#    restart: unless-stopped
    networks:
      - app-network

  api-backend:
    container_name: askdata-api-backend
    image: askdata-api-backend
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    depends_on:
      - oltp-db
      - mongodb
    environment:
      PYTHONPATH: /app
      MYSQL_OLTP_USER: ${MYSQL_OLTP_USER}
      MYSQL_OLTP_PASSWORD: ${MYSQL_OLTP_PASSWORD}
      MYSQL_OLTP_HOST: ${MYSQL_OLTP_HOST}
      MYSQL_OLTP_PORT: ${MYSQL_OLTP_PORT}
      MYSQL_OLTP_DATABASE: ${MYSQL_OLTP_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "5004:5004"
#    restart: unless-stopped
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: askdata-mongodb
    networks:
      - app-network
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d
      - mongo-data:/data/db
     # - ./.env:/app/.env
#    restart: unless-stopped
    
  etl-services:
    container_name: askdata-etl-services
    build:
      context: ./etl-services
      dockerfile: Dockerfile
    depends_on:
      - oltp-db
      - dw-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_OLTP_USER=${MYSQL_OLTP_USER}
      - MYSQL_OLTP_PASSWORD=${MYSQL_OLTP_PASSWORD}
      - MYSQL_OLTP_HOST=${MYSQL_OLTP_HOST}
      - MYSQL_OLTP_PORT=${MYSQL_OLTP_PORT}
      - MYSQL_OLTP_DATABASE=${MYSQL_OLTP_DATABASE}
      - MYSQL_DW_USER=${MYSQL_DW_USER}
      - MYSQL_DW_PASSWORD=${MYSQL_DW_PASSWORD}
      - MYSQL_DW_HOST=${MYSQL_DW_HOST}
      - MYSQL_DW_PORT=${MYSQL_DW_PORT}
      - MYSQL_DW_DATABASE=${MYSQL_DW_DATABASE}
    volumes:
      - ./.env:/app/.env 
    ports:
      - "5003:5003"
    restart: unless-stopped
    networks:
      - app-network

  # Product Recommendation Service
  recommendation-service:
    container_name: askdata-recommendation-service
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    depends_on:
      - oltp-db
      - dw-db
    environment:
      - PYTHONPATH=/app
      - MYSQL_OLTP_USER=${MYSQL_OLTP_USER}
      - MYSQL_OLTP_PASSWORD=${MYSQL_OLTP_PASSWORD}
      - MYSQL_OLTP_HOST=${MYSQL_OLTP_HOST}
      - MYSQL_OLTP_PORT=${MYSQL_OLTP_PORT}
      - MYSQL_OLTP_DATABASE=${MYSQL_OLTP_DATABASE}
      - MYSQL_DW_USER=${MYSQL_DW_USER}
      - MYSQL_DW_PASSWORD=${MYSQL_DW_PASSWORD}
      - MYSQL_DW_HOST=${MYSQL_DW_HOST}
      - MYSQL_DW_PORT=${MYSQL_DW_PORT}
      - MYSQL_DW_DATABASE=${MYSQL_DW_DATABASE}
    volumes:
      - ./recommendation-service/output:/app/output
      - ./.env:/app/.env
    ports:
      - "5005:5005"
    networks:
      - app-network
    command: ["python3", "src/main.py", "--source", "oltp", "--batch-size", "100"]

  # Ollama service for AI model serving
  ollama:
    container_name: askdata-ollama
    build:
      context: ./ollama
    image: ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      # - ./.env:/app/.env  # optional, currently commented out
    restart: unless-stopped
    networks:
      - app-network

  # ChromaDB service for vector database
  vectordb:
    image: chromadb/chroma:latest
    container_name: askdata-chromadb
    ports:
      - "9000:8000"    # ChromaDB runs on port 8000 by default
    volumes:
      - ./chromadb/chroma_data:/data  # Bind mount to local directory
     # - ./.env:/app/.env
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - app-network

  app:
    build:
      context: ./ui-frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./app/target:/app/target  # Mount upload directory
     # - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app
      - MYSQL_UI_USER=${MYSQL_UI_USER}
      - MYSQL_UI_PASSWORD=${MYSQL_UI_PASSWORD}
      - MYSQL_UI_HOST=ui-frontend-db
      - MYSQL_UI_PORT=3306
      - MYSQL_UI_DATABASE=${MYSQL_UI_DATABASE}
      - KEYCLOAK_URL=http://keycloak:8080
    depends_on:
      - db
      - keycloak
    networks:
      - app-network
  
  db:
    image: mysql:latest
    container_name: ui-frontend-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_UI_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_UI_DATABASE}
      MYSQL_USER: ${MYSQL_UI_USER}
      MYSQL_PASSWORD: ${MYSQL_UI_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./ui-frontend-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      #- ./.env:/app/.env
    networks:
      - app-network

  keycloak-db:
      image: postgres:16
      ports: 
        - "5432:5432"
      environment:
        POSTGRES_DB: keycloak
        POSTGRES_USER: keycloak
        POSTGRES_PASSWORD: keycloak
      volumes:
        - keycloak_pg_data:/var/lib/postgresql/data
       # - ./.env:/app/.env
      restart: unless-stopped
      networks:
        - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.1
    command: 
      - start-dev
      - --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Admin credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      #KC_HOSTNAME: keycloak    # For easy setup on localhost
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    restart: unless-stopped
    volumes: 
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import
#      - ./.env:/app/.env
    networks:
      - app-network

volumes:
  mongo-data:
  ollama_data:
  chromadb_data:
  db_data:
  keycloak_pg_data:
  keycloak_data:
  
networks:
  app-network:
    driver: bridge
