services:
  oltp-db:
    image: mysql:latest
    container_name: oltp-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: oltp
      MYSQL_USER: oltpuser
      MYSQL_PASSWORD: oltppassword
    ports:
      - "3306:3306"
    restart: unless-stopped

  dw-db:
    image: mysql:latest
    container_name: dw-db
    networks:
      - app-network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dw
      MYSQL_USER: dwuser
      MYSQL_PASSWORD: dwpassword
    ports:
      - "3307:3306"
    restart: unless-stopped

  # pgAdmin tool, for if/when we need to manage PgSQL databases
