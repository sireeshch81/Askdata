[project]
name = "oltp-backend"
version = "0.1.0"
description = "Services for OLTP (Online Transaction Processing). This includes schema management, data loading, and data extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "uvicorn",
    "psycopg2-binary",   # PostgreSQL support
    "pymysql",  # Add this for MySQL support
    "sqlalchemy",
    "uv",
    "cryptography",
    "python-dotenv",
    "pandas>=2.2.0",
    "pandas-stubs"
]
